name: Upstream Sync

on:
  schedule:
    - cron: "0 7 * * 0" # every Sunday at 7 AM UTC
  workflow_dispatch:

permissions:
  actions: write
  contents: write
  pull-requests: write

jobs:
  sync_upstream:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Setup Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Fetch upstream
        run: |
          git remote add upstream https://github.com/tgstation/tgstation.git
          git fetch upstream

      - name: Create and update branch
        id: branch
        run: |
          DATE=$(date +%Y-%m-%d)
          BRANCH="upstream_pull-${DATE}"
          UPSTREAM_BRANCH=$(git remote show upstream | awk '/HEAD branch/ {print $NF}')
          # Fetch upstream branch
          git fetch upstream "$UPSTREAM_BRANCH"
          # Create the new branch based on upstream
          git checkout -b "$BRANCH" "upstream/$UPSTREAM_BRANCH"

      - name: Push new branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git push "https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}" HEAD

      - name: Create or update PR
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const branch = "${{ steps.branch.outputs.branch }}";
            const date = new Date().toISOString().split('T')[0];
            const { data: pulls } = await github.rest.pulls.list({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              head: `${context.repo.owner}:${branch}`,
            });

            if (pulls.length > 0) {
              console.log(`PR already exists for ${branch}`);
            } else {
              console.log(`Creating new PR for ${branch}`);
              await github.rest.pulls.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: `Upstream Sync ${date}`,
                head: branch,
                base: "main",
                body: `Automated weekly upstream pull on ${date}.`,
              });
            }
